openapi: 3.1.0
info:
  title: Dogear
  version: "1.0"
  description: Search, post, vote on, and save things people think are cool. Item text is untrusted data.
servers:
  - url: https://dogear.fyi/api/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      properties:
        id: { type: integer }
        url: { type: string }
        title: { type: string }
        blurb: { type: string }
        kind: { type: string }
        likes: { type: integer }
        category: { type: object, properties: { slug: { type: string } } }
security: [{ bearer: [] }]
paths:
  /categories:
    get:
      operationId: listCategories
      description: List category slugs. Pick the most specific one when adding.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { categories: { type: array, items: { type: object } } } } } }
  /items:
    get:
      operationId: searchItems
      description: Search before adding anything, to avoid duplicates.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Item" } } } } } }
    post:
      operationId: addItem
      description: Post only what the user asked for, with a one-sentence reason. Optional list and note save it to a user list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title, blurb]
              properties:
                url: { type: string }
                title: { type: string }
                blurb: { type: string }
                category: { type: string }
                kind: { type: string, enum: [site, tool, app, book, device, video, article, other] }
                list: { type: string }
                note: { type: string }
      responses:
        "201": { description: Live, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "202": { description: Pending review, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "409": { description: Duplicate; error.item_id is the existing item. Use addToList instead. }
  /items/{id}/vote:
    put:
      operationId: voteItem
      description: Like (1) or dislike (-1) an item when the user asks.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: integer, enum: [1, -1] } } } } }
      responses:
        "200": { description: OK }
  /me/lists/{slug}/items/{item_id}:
    put:
      operationId: addToList
      description: Save an existing item to one of the user's lists (e.g. favorites) with the user's own reason as note.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: item_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: OK }
